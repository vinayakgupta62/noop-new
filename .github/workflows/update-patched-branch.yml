name: Update patched branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Apply personal patches to latest NOOP release
    runs-on: ubuntu-latest

    steps:
      - name: Check out personal patch stack
        uses: actions/checkout@v4
        with:
          ref: clock-fix-source
          fetch-depth: 0

      - name: Fetch Ryan's latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/ryanbr/noop.git || true

          LATEST_TAG=$(gh api repos/ryanbr/noop/releases/latest --jq '.tag_name')

          if [ -z "$LATEST_TAG" ]; then
            echo "::error::Could not determine Ryan's latest release."
            exit 1
          fi

          echo "Ryan's latest release: $LATEST_TAG"

          git fetch upstream \
            "refs/tags/${LATEST_TAG}:refs/tags/${LATEST_TAG}"

          echo "LATEST_TAG=${LATEST_TAG}" >> "$GITHUB_ENV"

      - name: Apply personal patches
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SOURCE="origin/clock-fix-source"

          git fetch origin clock-fix-source

          # Find the upstream commit immediately below your patch stack.
          BASE=$(git merge-base "$LATEST_TAG" "$SOURCE")

          mapfile -t PATCHES < <(
            git rev-list --reverse --no-merges "$BASE..$SOURCE"
          )

          echo "Latest release: $LATEST_TAG"
          echo "Found ${#PATCHES[@]} personal patch commit(s)."

          # Start from Ryan's published release, not unreleased main.
          git switch -C patched-latest "$LATEST_TAG"

          for commit in "${PATCHES[@]}"; do
            echo "Applying $(git log -1 --format='%h %s' "$commit")"

            if git cherry-pick "$commit"; then
              continue
            fi

            if git diff --quiet && git diff --cached --quiet; then
              echo "$commit is already present in Ryan's release; skipping."
              git cherry-pick --skip
            else
              echo "::error::A personal patch conflicts with Ryan's latest release."
              echo "::error::Nothing was pushed."
              git cherry-pick --abort || true
              exit 1
            fi
          done

          git commit --allow-empty \
            -m "Patched build based on ${LATEST_TAG} [skip ci]"

          git push --force origin HEAD:patched-latest
